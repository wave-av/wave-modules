name: shell-lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: shell-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run shellcheck on all shell scripts
        run: |
          set -euo pipefail
          # PORTABILITY — this body must also run under bash 3.2 (macOS's only bash),
          # where `mapfile` does not exist. With no `set -e` the missing builtin was
          # NON-FATAL: `files` stayed unset, `${#files[@]}` read 0, and the gate printed
          # "No shell scripts found." and exited 0 — reporting SUCCESS having linted
          # nothing, with real violations sitting in the tree. `read -d ''` is bash 3.2
          # -safe and preserves the NUL-delimited (newline-in-filename-safe) contract.
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(find . -name '*.sh' -not -path './.git/*' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          # `${arr[@]+"${arr[@]}"}` — bash treats an EMPTY array as UNSET under `set -u`,
          # so a bare "${files[@]}" would abort the step if the count guard above ever moves.
          printf '%s\n' "${files[@]+"${files[@]}"}"
          shellcheck "${files[@]+"${files[@]}"}"
